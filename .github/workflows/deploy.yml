name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every night around 03:17 Brussels time (cron runs in UTC).
    # Nothing depends on this run; it only refreshes the build.
    - cron: '17 1 * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Afhankelijkheden installeren
        run: pnpm install --frozen-lockfile

      - name: Typecontrole
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: PDF-hulpmiddelen installeren
        run: command -v pdftoppm || (sudo apt-get update && sudo apt-get install -y poppler-utils)

      - name: Pagina's van 't Voske uit de cache halen
        uses: actions/cache@v5
        with:
          path: public/voske/pagina
          key: voske-pagina-${{ hashFiles('public/voske/*.pdf', 'src/integrations/voske-pages.ts') }}
          restore-keys: voske-pagina-

      - name: Site bouwen
        run: pnpm build

      - name: Grootte van de site
        run: |
          bytes=$(du -sb dist | cut -f1)
          mb=$((bytes / 1024 / 1024))
          echo "Gebouwde site: ${mb} MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$mb" -gt 700 ]; then
            echo "::warning::De site is ${mb} MB. De limiet van GitHub Pages is 1 GB."
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  report-failure:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Issue aanmaken
        uses: actions/github-script@v9
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Publiceren van de site is mislukt';
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'deploy' });
            const body = `De laatste publicatie is mislukt, de site toont nog de vorige versie.\n\nDetails: ${run}`;
            if (open.data.some((i) => i.title === title)) {
              const issue = open.data.find((i) => i.title === title);
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['deploy'] });
            }
